[project]
name = "kronos-vs-har"
version = "0.1.0"
description = "Does the Kronos candlestick foundation model beat HAR-RV at next-day realised variance after its data cutoff, and can a tiny student keep the edge?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.13",
    "arch>=7.0",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "requests>=2.31",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "einops>=0.8",
    "pytest>=8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
